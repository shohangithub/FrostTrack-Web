<div class="modal-header">
  <h4 class="modal-title fw-bold font-17" id="modal-basic-title">
    {{ isEditing ? "Update" : "Add" }} Transaction Group
  </h4>
  <button
    type="button"
    class="close"
    aria-label="Close"
    (click)="modal.dismiss(false)"
  >
    <span aria-hidden="true"><i class="material-icons">close</i></span>
  </button>
</div>

<div class="modal-body">
  @if (isLoading) {
  <app-form-shimmer [height]="150"></app-form-shimmer>
  } @else {
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
        <label>Name <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control form-control-sm"
          formControlName="name"
          placeholder="e.g. এম ডি স্যার"
          required
        />
        @if (!form.get('name')?.valid && form.get('name')?.touched) {
        <small class="form-text text-danger"> Name is required </small>
        }
      </div>
    </div>
    <div class="row">
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
        <label>Sort Order</label>
        <input
          type="number"
          class="form-control form-control-sm"
          formControlName="sortOrder"
          placeholder="0"
        />
      </div>
      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
        <label>Status <span class="text-danger">*</span></label>
        <select
          class="form-select form-control-sm"
          formControlName="isActive"
          required
        >
          @for (status of statusList; track status) {
          <option [value]="status.id">
            {{ status.value }}
          </option>
          }
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
        <label>Description</label>
        <textarea
          class="form-control form-control-sm"
          formControlName="description"
          rows="2"
          placeholder="Optional description"
        ></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!form.valid || isSubmitted"
      >
        {{ isEditing ? "Update" : "Submit" }}
      </button>
      <button type="button" class="btn btn-light" (click)="modal.close(false)">
        Close
      </button>
    </div>
  </form>
  }
</div>
